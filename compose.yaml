services:
  # ===== DATA LAYER =====
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isas-network

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - isas-network

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - isas-network

  # ===== .NET SERVICES =====
  isas.authservice:
    image: isas.authservice
    build:
      context: .
      dockerfile: src/services/Isas.AuthService/Dockerfile
      target: final
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis
    networks:
      - isas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "cat /proc/net/tcp6 | grep 1F90 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  isas.gateway:
    image: isas.gateway
    build:
      context: .
      dockerfile: src/gateway/Isas.Gateway/Dockerfile
    ports:
      - "5050:8080"
    depends_on:
      isas.authservice:
        condition: service_healthy
    networks:
      - isas-network
    restart: unless-stopped

networks:
  isas-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
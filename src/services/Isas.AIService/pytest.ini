[pytest]
asyncio_mode = auto

# 🔴 BẮT BUỘC — không có dòng này thì `pytest` (console script) ném ModuleNotFoundError: 'app'
# cho CẢ 26 file test, trong khi `python -m pytest` lại chạy sạch.
#
# Vì sao: `python -m pytest` chèn CWD vào `sys.path` (hành vi của `-m`), còn console script thì
# KHÔNG. Suốt từ trước tới nay mọi người chạy bằng `python -m pytest`, nên bộ test đứng vững nhờ
# CÁCH GỌI chứ không nhờ cấu hình — một phụ thuộc ẩn không ai biết mình đang dựa vào. Nó chỉ lộ
# ra lần đầu khi CI (2026-08-06) chạy `pytest -q`.
#
# `pythonpath` khoá chuyện đó lại ở đúng chỗ: cấu hình của bộ test, không phải lệnh của người gọi.
pythonpath = .

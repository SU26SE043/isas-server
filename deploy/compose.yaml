# ISAS — FULL production stack (server host).
#
# ⚠⚠ FILE NÀY **KHÔNG PHẢI** ARTIFACT ĐANG CHẠY PRODUCTION. ⚠⚠
# Stack thật do `/home/duc2834/docker/main/docker-compose.yml` TRÊN SERVER quản (compose project
# `main` — kiểm bằng label `com.docker.compose.project` / `com.docker.compose.project.config_files`
# của bất kỳ container nào). Hai file đã trôi khỏi nhau theo CẢ HAI CHIỀU và từng để lại hậu quả
# thật: bản repo có lúc còn `ApiServices__<index>__…` (bug đã sửa ở PR #100, làm 119/144 endpoint
# sai đường dẫn trên Scalar) và `Invitation__BaseUrl=${GATEWAY_PUBLIC_URL}` (magic-link mời B2B
# chết, sửa ở `6507b2e`) — deploy bằng file repo lúc đó = dựng lại nguyên hai con bug.
#
# ⇒ ĐỔI CẤU HÌNH PHẢI SỬA **CẢ HAI** cho tới khi hợp nhất được về một nguồn.
# Kiểm lệch:  ssh duc2834@100.64.204.33 "cat ~/docker/main/docker-compose.yml"   rồi so với file này.
# Đối chiếu gần nhất: **2026-08-02**. Những chỗ CỐ Ý còn khác server sau lần đối chiếu đó:
#   · `Tiering__*` (payment + campaign) và `Payment__BaseUrl` (campaign) — D28, chưa lên server, mặc định TẮT.
#   · `Adaptive__*` — repo THAM SỐ HOÁ qua .env với mặc định AN TOÀN (`ADAPTIVE_ENABLED=false`,
#     seed 5 / trần 20), server ghi CỨNG `true` / seed 1 / trần 6 và .env server CHƯA khai biến nào.
#     ⚠ Dùng file này trên server mà không đặt `ADAPTIVE_*` trong .env = TẮT phỏng vấn thích ứng.
#   · `Cors__AllowedOrigins__6` — xem chú thích ở gateway (server khai TRÙNG index 4).
#   · 🔴 `Internal__CallbackBase` — repo nay dùng TÊN CONTAINER; server còn ghi cứng
#     `http://100.64.204.33:5247` và đó là trạng thái ĐANG HỎNG (callback sàng CV timeout), KHÔNG
#     phải "tương đương" như dòng này từng ghi. Phải áp tay lên server, xem DEPLOYMENT.md §C14.
# AIService ĐƯỢC khai ở gateway (`ApiServices__ai` + `ai-cluster` bên dưới) — có chủ đích, KHÔNG
# mâu thuẫn GEN-7: hai thứ đó chỉ có tác dụng ở **Development**, nơi Scalar phải liệt kê VÀ gọi
# được TOÀN BỘ api. Ở Production, `IsGatewayAiPath` (Program.cs) trả 404 cho `/api/v1/ai/*` và
# aggregator bỏ qua tên `ai` ⇒ AIService vẫn internal-only. Server cũng còn `expose: ["8080"]`
# thừa ở campaignservice (đã có `ports` 5247).
# ⚠ `ASPNETCORE_ENVIRONMENT=Development` bên dưới = MIRROR đúng production hôm nay, nhưng đó là
# lỗi đã biết (`OPS6`, tái diễn 3 lần): Development làm gateway KHÔNG bật khối chặn `/internal/*`
# + `/api/v1/ai/*`, và service trả stack trace ra ngoài. Sửa = quyết định deploy, không sửa lén ở đây.
#
# Faithful extract of DEPLOYMENT.md §4 (previously only lived as a fenced block there).
# ⚠ DEPLOYMENT.md §4 là artifact THỨ BA và cũng đã lệch (còn `FRONTEND_BASE_URL` /
# `GATEWAY_PUBLIC_BASE_URL`, trong khi .env server dùng `FRONTEND_PUBLIC_URL` / `GOOGLE_PUBLIC_BASE_URL`).
#
# Usage (server, e.g. ~/docker/main/ — keep .env + seaweed-s3.json NEXT TO this file):
#   cp ../.env.example .env   # then fill real values (chmod 600 .env)
#   docker compose -f deploy/compose.yaml up -d
#
# NO secret values are committed here — every credential is a ${VAR} placeholder
# resolved from .env (keys match ../.env.example). Images come from GHCR (CI-built).
# AIService (aiapi/aiworker) nay chạy TRONG file này — trước 2026-08-06 nó ở trên Mac.
# The root ../compose.yaml is a DEV-PARTIAL skeleton (Auth+Gateway+MinIO only) — THIS one describes the
# full stack (nhưng bản đang CHẠY vẫn là file trên server, xem cảnh báo đầu file).
#
# ===== §IMAGE_TAG — ĐƯỜNG LÙI DUY NHẤT =====
# Cả 6 `image:` dưới đây dùng `${IMAGE_TAG:-main}`. Không đặt biến ⇒ ra đúng `:main` như trước,
# nên đổi này KHÔNG làm lệch hành vi deploy hiện tại.
# VÌ SAO cần: repo có **0 tag git**, và `:main` là tag DI ĐỘNG — mỗi lần push lên `main` nó trỏ
# sang image mới. Deploy hỏng mà chỉ có `:main` thì không còn cách nào gọi tên bản tốt trước đó,
# ngoài chờ CI build lại (~15 phút) từ một commit revert. CI nay đẩy **tag đôi** `:main` +
# `:main-<sha>`; `:main-<sha>` là BẤT BIẾN ⇒ lùi = `IMAGE_TAG=main-<sha-tốt>` trong .env rồi
# `docker compose up -d`, tính bằng giây.
# ⚠ NHƯNG: file này KHÔNG phải artifact chạy thật (xem cảnh báo đầu file) ⇒ `IMAGE_TAG` chỉ có
# tác dụng SAU KHI file compose TRÊN SERVER cũng được tham số hoá y hệt. Sửa mỗi bên repo là
# không lùi được gì cả. Quy trình lùi đầy đủ: ../DEPLOYMENT.md §Rollback.
# ⚠ Lùi CODE không lùi được SCHEMA — `Down()` của `DropColumn` dựng lại cột RỖNG, dữ liệu đã mất.
# Đọc §Rollback trước khi lùi qua một mốc có migration.

x-aiservice-env: &aiservice-env
  GEMINI_API_KEY: ${GEMINI_API_KEY}          # env DUY NHẤT bắt buộc: thiếu → chết lúc import app.config
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  # ⚠ Thiếu key → OpenAI 401 → RƠI ÂM THẦM về Whisper cục bộ (lỗi từ 0,7% lên 4,2%), KHÔNG
  # sinh log lỗi nào. Cách duy nhất phát hiện là đọc `practice_answers.transcript_engine`.
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-whisper-1}
  # ⚠ Default TRONG CODE là `large-v3` = 2,9 GB tải về + 64-96s/lượt ⇒ vượt timeout decider 90s.
  # Production chạy `small`. ĐỪNG bỏ dòng này.
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  # Cổng im lặng: VAD không thấy tiếng người ⇒ KHÔNG chép lời, .NET đánh answer `Skipped`.
  # ⚠ Mặc định BẬT (khác GROUNDING/TIERING/CV_SCREENING): đây là bản vá cho hành vi ĐÃ ĐO ĐƯỢC LÀ
  # SAI — bản ghi im lặng 8s từng ra transcript "Hãy subscribe cho kênh Ghiền Mì Gõ…" và được chấm
  # điểm thật trên cả 5 tiêu chí (prod 2026-08-15). `false` = quay lui.
  SILENCE_GATE_ENABLED: ${SILENCE_GATE_ENABLED:-true}
  # Ba biến dưới có default trong code nhưng đều trỏ `localhost` ⇒ thiếu thì service khởi động
  # BÌNH THƯỜNG rồi mới hỏng lúc chạy. Đây là loại lỗi khó thấy nhất khi đổi topology.
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: isas-files
  USAGE_SINK_BASE: http://isas.paymentservice:8080        # F22 — nội bộ, KHÔNG qua gateway (GEN-1)
  PROMPT_REGISTRY_BASE: http://isas.interviewservice:8080  # F21
  # Trần thread cho việc CHẶN (đọc S3 + chép lời). 0 = mặc định asyncio (min(32,cpu+4)=12).
  # Production = **32**: đo 2026-08-06 ra 3,22 → 5,16 req/s (+60%), p95 9,67s → 6,95s.
  # ⚠ ĐỪNG nâng 64 — ở pool 32 tải tăng 32→48 chỉ +3% ⇒ trần thật (~5 req/s) nằm SAU pool.
  # Chi tiết số đo + cách đo lại: `app/config.py` §thread_pool_max_workers, `scripts/loadtest-ai-threadpool.py`.
  THREAD_POOL_MAX_WORKERS: ${AI_THREAD_POOL:-0}
  # ⚠ KILL-SWITCH SC1c = `QUESTION_MAX_ATTEMPTS` (BẬT MẶC ĐỊNH TRONG CODE = 2): bộ câu hỏi không phủ
  # đủ tiêu chí thì bị trả lại + sinh lại tối đa một lần — mỗi lần là MỘT lượt Gemini nữa nằm trong
  # request tạo buổi luyện. `1` = tắt hẳn việc sinh lại (vẫn giữ phần kiểm, vốn là hàm thuần).
  QUESTION_MAX_ATTEMPTS: ${QUESTION_MAX_ATTEMPTS:-2}
  # ⚠ KILL-SWITCH QV1 = `QUESTION_VERIFY_ENABLED`. Bật ĐỔI HÌNH DẠNG đường sinh: corpus thôi không
  # được cấp cho lượt SINH (chỉ dùng để KIỂM), citations đến TỪ lượt kiểm, và cộng thêm một lượt
  # Gemini mỗi lần sinh câu hỏi. Chỉ có nghĩa khi `GROUNDING_ENABLED=true` VÀ corpus đã nạp.
  QUESTION_VERIFY_ENABLED: ${QUESTION_VERIFY_ENABLED:-false}

x-aiservice: &aiservice
  image: ghcr.io/su26se043/isas.aiservice:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
  volumes:
    # Model tải lúc CHẠY (~480 MB whisper small + ~300 MB buffalo_l). Thiếu 2 volume này là tải
    # lại mỗi lần recreate — mà từ nay MỌI push lên `main` đều recreate.
    - ai_hf_cache:/root/.cache/huggingface
    - ai_insightface:/root/.insightface
  networks: [isas-main-network]
  restart: unless-stopped


services:
  # ===== DATA LAYER =====
  postgres:
    image: postgres:18
    container_name: postgres-main
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql
    networks: [isas-main-network]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-main
    restart: always
    # -s3.config bật S3 auth bằng file identities (seaweed-s3.json). THIẾU nó → S3 mở toang, key bị bỏ qua.
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0"
    ports:
      - "8333:8333"   # S3 API (Mac kéo audio qua tailnet)
      - "8888:8888"   # filer
      - "9333:9333"   # master UI
    volumes:
      - seaweedfs_main_data:/data
      - ./seaweed-s3.json:/etc/seaweedfs/s3.json:ro   # identities S3 (access/secret key)
    networks: [isas-main-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-main
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"    # AMQP (Mac worker consume qua tailnet)
      - "15672:15672"  # management UI
    networks: [isas-main-network]

  # RAG grounding — kho vector (chunk tri thức). InterviewService quản + gọi (gRPC 6334). Volume bền.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-main
    restart: unless-stopped
    # ⚠ CỐ Ý KHÔNG publish 6333/6334 ra host — khớp production. InterviewService gọi qdrant qua
    # network nội bộ (`Qdrant__Url=http://qdrant:6334`), không cần cổng ngoài; publish ra là mở
    # dashboard REST 6333 cho mọi thứ tới được host. Cần xem dashboard thì `docker compose port`
    # hoặc ssh tunnel, đừng mở cố định.
    volumes:
      - qdrant_main_data:/qdrant/storage
    networks: [isas-main-network]

  # ===== APP SERVICES =====
  isas.authservice:
    image: ghcr.io/su26se043/isas.authservice:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
    container_name: authservice-main
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Auth cũng phục vụ callback máy-máy `/internal/auth/provision-candidate` (D2 — join magic-link
      # B2B tạo tài khoản Candidate nhẹ). Thiếu token này → Campaign gọi sang bị từ chối, join B2B hỏng.
      - Internal__Token=${INTERNAL_TOKEN}
      # DB28 — job dọn refresh_token hết hạn. Giữ TẮT như production: xoá dữ liệu auth là không đảo
      # ngược được, và vị ngữ dọn có ngữ nghĩa NULL/so-sánh-thời-gian khác nhau giữa SQLite (test) và
      # Postgres (thật). Bật sau khi quan sát 1 chu kỳ — đây là quyết định ops, không phải mặc định.
      - RefreshTokenRetention__Enabled=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=isas;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=http://isas.authservice:8080
      - Jwt__Audience=http://isas.authservice:8080
      - Jwt__RefreshTokenDays=7
      - Jwt__AccessTokenMinutes=15
      - EmailSettings__Host=${SMTP_HOST}
      - EmailSettings__Port=${SMTP_PORT}
      - EmailSettings__Username=${SMTP_USER}
      - EmailSettings__Password=${SMTP_PASS}
      - EmailSettings__From=${SMTP_FROM}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      # Đăng nhập Google NATIVE cho app mobile (POST /auth/google/id-token) KHÔNG cần env riêng:
      # allowlist `aud` để trống sẽ rơi về ClientId ngay trên — đúng vì app xin ID token với
      # serverClientId = WEB client id nên `aud` chính là nó. Chỉ khai
      # `Authentication__Google__IdTokenAudiences__0=…` khi app cố tình dùng audience khác.
      # ⚠ Trống CẢ hai ⇒ endpoint trả 500 chứ KHÔNG bỏ qua kiểm tra `aud` (rỗng = nhận mọi Google ID token).
      # Đăng nhập Google: callback 302 về FE kèm MÃ DÙNG-MỘT-LẦN (?code=…), KHÔNG kèm token; FE đổi
      # mã lấy phiên qua POST /auth/google/exchange. Cả 2 URL lấy từ CONFIG SERVER (nhận đích từ
      # client = open-redirect làm rò phiên).
      # ⚠ Tên biến theo .env ĐANG CHẠY trên server (`FRONTEND_PUBLIC_URL` / `GOOGLE_PUBLIC_BASE_URL`).
      # DEPLOYMENT.md §4 còn ghi tên cũ `FRONTEND_BASE_URL` / `GATEWAY_PUBLIC_BASE_URL` — chưa hợp nhất.
      # `GOOGLE_PUBLIC_BASE_URL` phải KÈM `/api/v1` (gateway strip tiền tố) và khớp "Authorized
      # redirect URI" khai trên Google Cloud Console: {GOOGLE_PUBLIC_BASE_URL}/auth/signin-google.
      - Gateway__PublicBaseUrl=${GOOGLE_PUBLIC_BASE_URL}
      - Frontend__BaseUrl=${FRONTEND_PUBLIC_URL}
    expose: ["8080"]
    depends_on: [postgres]
    networks: [isas-main-network]
    restart: unless-stopped

  isas.interviewservice:
    image: ghcr.io/su26se043/isas.interviewservice:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
    container_name: interviewservice-main
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # DB28 — dọn outbox_messages đã publish. Giữ TẮT như production (cùng lý do RefreshTokenRetention
      # bên authservice: xoá là không đảo ngược, bật sau khi quan sát 1 chu kỳ).
      - Outbox__PurgeEnabled=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=isas_interview;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}                         # KHỚP authservice
      - Jwt__Issuer=http://isas.authservice:8080
      - Jwt__Audience=http://isas.authservice:8080
      - Internal__Token=${INTERNAL_TOKEN}           # KHỚP aiworker
      - SeaweedFS__ServiceURL=http://seaweedfs:8333
      - SeaweedFS__AccessKey=${S3_ACCESS_KEY}
      - SeaweedFS__SecretKey=${S3_SECRET_KEY}
      - SeaweedFS__BucketName=isas-files
      - SeaweedFS__ForcePathStyle=true
      - SeaweedFS__UseHttp=true
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - AiService__BaseUrl=http://aiapi:8000   # cùng compose network (trước 2026-08-06: Mac qua Tailscale)
      # RAG grounding — kho vector (Qdrant, cùng compose) + ingest Context7 + toggle bật retrieval.
      - Qdrant__Url=http://qdrant:6334
      - Context7__ApiKey=${CONTEXT7_API_KEY}
      # BC18 phân tích repo GitHub. RỖNG = an toàn, hành xử y như không có (`GitHubRepoFetcher.cs:67`
      # gác `!IsNullOrWhiteSpace` trước khi gắn header Authorization) — NHƯNG khi đó là GitHub API
      # **ẨN DANH: 60 req/h DÙNG CHUNG theo IP server**, mỗi lượt phân tích 4–9 call ⇒ ~7–15 lượt/giờ
      # cho TOÀN BỘ người dùng, sau đó mọi ai cũng ăn 429. Có token → 5000 req/h.
      # ⚠ Không có section `GitHub` trong `appsettings.json` ⇒ khoá này CHỈ đặt được qua env.
      - GitHub__Token=${GITHUB_TOKEN}
      # Grounding:Enabled mặc định TẮT (chuỗi rỗng không parse int/bool an toàn → dùng default). Bật khi có corpus.
      - Grounding__Enabled=${GROUNDING_ENABLED:-false}
      # Phỏng vấn THÍCH ỨNG (INT-17 / INT-17b). Trước đây 3 khoá này chỉ tồn tại trong compose SỬA TAY trên
      # server, không có trong repo — nên hình dạng buổi phỏng vấn chạy thật chỉ đọc được bằng `docker inspect`,
      # và một khoá mới (`MaxDeepPerQuestion`) thêm vào appsettings là âm thầm đổi hành vi production.
      # ⚠ KILL-SWITCH = `MaxDeepPerQuestion`: đặt 0 → quay lại chế độ frontier trước INT-17b (`MaxFollowUps`
      # lúc đó mới có hiệu lực; chế độ chuỗi thì code tự ép về 0). Đặt `Adaptive__Enabled=false` → tắt hẳn
      # phỏng vấn thích ứng, về luồng batch tĩnh.
      - Adaptive__Enabled=${ADAPTIVE_ENABLED:-false}
      - Adaptive__SeedCount=${ADAPTIVE_SEED_COUNT:-5}
      - Adaptive__MaxQuestions=${ADAPTIVE_MAX_QUESTIONS:-20}
      - Adaptive__MaxFollowUps=${ADAPTIVE_MAX_FOLLOW_UPS:-3}
      - Adaptive__MaxDeepPerQuestion=${ADAPTIVE_MAX_DEEP_PER_QUESTION:-3}
      - Adaptive__MaxFailuresPerSession=${ADAPTIVE_MAX_FAILURES_PER_SESSION:-3}
      # Trần BỎ CUỘC cho answer chờ chấm. Quá ngần này phút kể từ lúc TẠO answer mà chưa gom đủ N
      # attempt (E10) → thôi đẩy lại, chốt sổ bằng điểm đã có (hoặc Skipped) rồi đóng buổi.
      # 60 chừa ~3 lượt đẩy lại (mốc 15'); 0 = tắt = quay lại hành vi kẹt vô hạn.
      - Scoring__GiveUpAfterMinutes=${SCORING_GIVE_UP_AFTER_MINUTES:-60}
    ports:
      - "5246:8080"     # publish để Mac gọi callback /internal/... qua tailnet
    depends_on: [postgres, seaweedfs, rabbitmq, qdrant]
    networks: [isas-main-network]
    restart: unless-stopped

  isas.campaignservice:
    image: ghcr.io/su26se043/isas.campaignservice:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
    container_name: campaignservice-main
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # DB2b — dọn outbox_messages (email mời) đã publish. Giữ TẮT như production.
      - Outbox__PurgeEnabled=false
      # BK25/DATA-3 — dọn ảnh sinh trắc (face-live/face-reference) quá hạn giữ trong SeaweedFS.
      # TẮT tường minh: thứ bị xoá là bằng chứng chống gian lận của buổi thi, không đảo ngược được.
      # Bật sau khi quan sát 1 chu kỳ và đối chiếu log "FaceImagePurger: đã xoá N ảnh".
      - FaceImageRetention__Enabled=false
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=isas_campaign;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=http://isas.authservice:8080
      - Jwt__Audience=http://isas.authservice:8080
      - AiService__BaseUrl=http://aiapi:8000
      - SeaweedFS__ServiceURL=http://seaweedfs:8333
      - SeaweedFS__AccessKey=${S3_ACCESS_KEY}
      - SeaweedFS__SecretKey=${S3_SECRET_KEY}
      - SeaweedFS__BucketName=isas-files
      - SeaweedFS__ForcePathStyle=true
      # RabbitMQ — Campaign publish email mời (D1) + cv-screening (C14) + consume ranking (E4).
      # THIẾU → POST /invitations 500 "endpoints not reachable" (bắt ở API sweep 2026-07-13).
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      # D28 — B2B tier gate stays off until staging verification. When enabled, this client must
      # resolve Payment directly with the internal token; it never goes through Gateway.
      - Payment__BaseUrl=http://isas.paymentservice:8080
      # D2 — join magic-link: Campaign gọi Auth `/internal/auth/provision-candidate` (tạo/lấy tài khoản
      # Candidate theo email) rồi Interview `/internal/sessions/campaign` (create-or-get session lúc
      # Start). THIẾU 2 base URL này → join/start B2B 500 (bắt ở đợt hardening 2026-07-15).
      - Auth__BaseUrl=http://isas.authservice:8080
      - Interview__BaseUrl=http://isas.interviewservice:8080
      - Internal__Token=${INTERNAL_TOKEN}
      # C14 — callback sàng CV: aiworker → campaignservice (KHÔNG qua gateway, GEN-1).
      # 🔴 Trước đây chỗ này là `http://${SERVER_TS_IP}:5247` và DEPLOYMENT.md ghi đó là lựa chọn "có
      # chủ ý" vì IP tailnet tới được từ CẢ container trên server LẪN Mac. Tiền đề đó SAI: container
      # trên bridge network KHÔNG tới được IP Tailscale của chính host. Từ 2026-08-06 aiworker chạy
      # trên server ⇒ callback timeout → nack → republish vô hạn, ứng viên kẹt `Analyzing`; sau
      # `Screening:GiveUpAfterHours` (6h) → `AnalysisFailed`, mà KHÔNG có endpoint HR retry.
      # Triệu chứng đánh lừa: publish OK, queue có consumer, worker vẫn chấm answer bình thường.
      # ⚠ Đường lùi chạy aiworker trên Mac PHẢI đổi khoá này về `http://${SERVER_TS_IP}:5247`
      # (cổng 5247 vẫn publish bên dưới nên đường đó còn dùng được).
      - Internal__CallbackBase=http://isas.campaignservice:8080
      - Tiering__Enabled=${TIERING_ENABLED:-false}
      # SMTP — InvitationEmailConsumer gửi email mời (magic-link) khi tiêu thụ campaign_invitation_email_queue.
      - EmailSettings__Host=${SMTP_HOST}
      - EmailSettings__Port=${SMTP_PORT}
      - EmailSettings__Username=${SMTP_USER}
      - EmailSettings__Password=${SMTP_PASS}
      - EmailSettings__From=${SMTP_FROM}
      # Magic-link ứng viên = {baseUrl}/invite/{token} — PHẢI là origin của FRONTEND.
      # 🔴 Trước đây chỗ này ghi `${GATEWAY_PUBLIC_URL}` + path `/invitations/`: sai HAI lớp (gateway chỉ
      # phục vụ `/api/v1/...`, còn `/invitations/:token` là route API trả JSON — route FE là `invite/:token`)
      # ⇒ link trong email trả 404 body RỖNG = trang trắng, nhìn y như đang tải, sống nhiều ngày không ai
      # báo. Sửa ở `6507b2e` (+ gỡ hẳn fallback về `Gateway:Url`, vì fallback làm cấu hình TRÔNG như đã đặt).
      - Invitation__BaseUrl=${FRONTEND_PUBLIC_URL}
    ports:
      # DI SẢN: callback C14 nay đi bằng tên container (xem Internal__CallbackBase ở trên). Cổng này chỉ
      # còn cho thao tác ops qua tailnet + đường lùi chạy aiworker trên Mac. ⚠ Nó lộ toàn bộ API
      # campaignservice NGOÀI gateway — gỡ là quyết định ops riêng, không gộp vào bản vá này.
      - "5247:8080"
    depends_on: [postgres, seaweedfs, rabbitmq]
    networks: [isas-main-network]
    restart: unless-stopped

  isas.paymentservice:
    image: ghcr.io/su26se043/isas.paymentservice:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
    container_name: paymentservice-main
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=isas_payment;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=http://isas.authservice:8080
      - Jwt__Audience=http://isas.authservice:8080
      - Internal__Token=${INTERNAL_TOKEN}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - PayOS__ClientId=${PAYOS_CLIENT_ID}
      - PayOS__ApiKey=${PAYOS_API_KEY}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY}
      - PayOS__ReturnUrl=${PAYOS_RETURN_URL}     # BF3 — bắt buộc, PayOS reject tạo link nếu null
      - PayOS__CancelUrl=${PAYOS_CANCEL_URL}     # BF3 — bắt buộc
      # Kênh CHI (hoàn tiền tự động) — credential RIÊNG, không dùng chung kênh thu ở trên.
      - PayOS__Payout__ClientId=${PAYOS_PAYOUT_CLIENT_ID:-}
      - PayOS__Payout__ApiKey=${PAYOS_PAYOUT_API_KEY:-}
      - PayOS__Payout__ChecksumKey=${PAYOS_PAYOUT_CHECKSUM_KEY:-}
      # Mặc định TẮT — bật tường minh sau khi đối soát kênh chi.
      - RefundPayout__Enabled=${REFUND_PAYOUT_ENABLED:-false}
      - RefundPayout__MaxAutoPayoutVnd=${REFUND_PAYOUT_MAX_VND:-2000000}
      - Interview__BaseUrl=http://isas.interviewservice:8080   # DB18 — OrphanReservationReconciler gọi Interview /internal/sessions/exists (trống → reconciler safe-skip)
      # BK24 — `InvoiceOverdueReconciler` đóng dấu hoá đơn postpaid Issued→Overdue quá hạn. Đó là cái
      # PHANH của BK17 (org có hoá đơn Overdue thì reserve → 402): không bật thì postpaid là "trả sau"
      # KHÔNG có phanh. Bật thật trên server 2026-07-23.
      - InvoiceOverdue__Enabled=true
      - InvoiceOverdue__GraceHours=24
      - InvoiceOverdue__ScanIntervalSeconds=600
      # D28 — keep both safeguards explicit during additive rollout. Unlimited plans remain disabled.
      - Tiering__Enabled=${TIERING_ENABLED:-false}
      - Tiering__AllowUnlimitedPlans=${TIERING_ALLOW_UNLIMITED_PLANS:-false}
      # F7 — suất dùng thử tặng lúc tạo ví User. Có default :-3 vì chuỗi RỖNG không parse được thành int
      # (env thiếu sẽ làm options binder ném lúc khởi động). Đặt 0 để tắt hẳn.
      - Billing__FreeTrialCredits=${FREE_TRIAL_CREDITS:-3}
    ports:
      - "5271:8080"     # publish để webhook PayOS gọi vào (cần public URL/tunnel)
    depends_on: [postgres, rabbitmq]
    networks: [isas-main-network]
    restart: unless-stopped

  isas.gateway:
    image: ghcr.io/su26se043/isas.gateway:${IMAGE_TAG:-main}   # §IMAGE_TAG đầu file
    container_name: gateway-main
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Chỉ override địa chỉ runtime; routing /api/v1 lấy từ appsettings.json trong image.
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-node-01__Address=http://isas.authservice:8080
      - ReverseProxy__Clusters__interview-cluster__Destinations__interview-node-01__Address=http://isas.interviewservice:8080
      - ReverseProxy__Clusters__campaign-cluster__Destinations__campaign-node-01__Address=http://isas.campaignservice:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__payment-node-01__Address=http://isas.paymentservice:8080
      # `ai-cluster` PHẢI trỏ `aiapi:8000` (từ 2026-08-06 AIService là container anh em, trước đó
      # ở trên Mac nên appsettings để `localhost:8000` — địa chỉ đó nay chết trong container gateway).
      # Không có dòng này thì Scalar ở Development liệt kê endpoint AI nhưng bấm "Test Request" là 502.
      #
      # ⚠ KHÔNG mâu thuẫn GEN-7: cặp `ai-route` + `ai-cluster` chỉ sống ở **Development**. Ở Production
      # `IsGatewayAiPath` (Program.cs) trả 404 trước cả UseRouting ⇒ AIService vẫn internal-only.
      # Đúng ý đồ đã ghi trong Program.cs: Development = Scalar thấy VÀ gọi được TOÀN BỘ api.
      - ReverseProxy__Clusters__ai-cluster__Destinations__ai-node-01__Address=http://aiapi:8000
      #
      # 🔴 ApiServices phải khai theo TÊN (`ApiServices__<tên>__OpenApiUrl`), KHÔNG theo index.
      # Dạng cũ `ApiServices__0__…` là bug đã sửa ở PR #100: appsettings khai 5 entry còn compose khai
      # 4 URL ⇒ mỗi service ghép nhầm `Prefix` của service khác (119/144 op sai đường dẫn trên Scalar),
      # Payment không có entry nên đổ hết path ra root. Với bản keyed hiện tại, `__0__` còn tệ hơn: nó
      # tạo entry tên "0" KHÔNG có Prefix (bị bỏ qua + log Error) trong khi 4 service thật giữ nguyên URL
      # localhost:517x của appsettings ⇒ gộp OpenAPI hỏng SẠCH. Tên hợp lệ: auth · interview · campaign · payment.
      - ApiServices__auth__OpenApiUrl=http://isas.authservice:8080/openapi/v1.json
      - ApiServices__interview__OpenApiUrl=http://isas.interviewservice:8080/openapi/v1.json
      - ApiServices__campaign__OpenApiUrl=http://isas.campaignservice:8080/openapi/v1.json
      - ApiServices__payment__OpenApiUrl=http://isas.paymentservice:8080/openapi/v1.json
      # AIService: FastAPI phục vụ schema ở `/openapi.json` (KHÔNG phải `/openapi/v1.json` như 5
      # image .NET, và cũng không phải `/api/v1/openapi.json` — đã thử, 404). Thiếu dòng này thì
      # aggregator vẫn đọc `localhost:8000` của appsettings → Connection refused mỗi 30s (~12 dòng
      # rác/phút) VÀ 14 endpoint AI biến mất khỏi Scalar. Production không fetch (aggregator bỏ qua
      # tên `ai` khi môi trường ≠ Development) nên dòng này chỉ có tác dụng ở Development.
      - ApiServices__ai__OpenApiUrl=http://aiapi:8000/openapi.json
      - Gateway__Url=${GATEWAY_PUBLIC_URL}
      #
      # ===== FR18 — gom số liệu HTTP rồi FLUSH về PaymentService =====
      # `TrafficFlushService.cs:11` thoát ngay (log "FR18 traffic flush disabled or incomplete
      # configuration") nếu THIẾU BẤT KỲ vế nào trong BA vế dưới. Trước bản này gateway thiếu HAI
      # vế (`Analytics__Enabled` + `Internal__Token`) và vế thứ ba trỏ SAI ⇒ tính năng tắt câm.
      #
      # ⚠ Tên section là `Analytics`, KHÔNG phải `TrafficAnalytics`
      #   (`TrafficAnalyticsOptions.cs:4` → `SectionName = "Analytics"`). Grep nhầm tên sẽ ra
      #   "không có ở đâu cả" trong khi `appsettings.json:9-14` vốn ĐÃ có section (Enabled=false).
      - Analytics__Enabled=${ANALYTICS_ENABLED:-true}
      #
      # ⚠ Vế NGUY HIỂM NHẤT: mặc định appsettings là `http://localhost:5271` — **parse ĐƯỢC** thành
      # Uri tuyệt đối nên guard `Uri.TryCreate` cho qua, rồi mọi lần POST đều hỏng vì trong container
      # gateway thì `localhost` là chính nó. Hỏng IM LẶNG (catch → LogWarning, at-most-once, mất
      # luôn cửa sổ đang drain). Phải trỏ TÊN CONTAINER — cùng mẫu `USAGE_SINK_BASE` (F22) ở đầu file.
      # Đi THẲNG container-to-container, KHÔNG qua gateway ⇒ không đụng GEN-1.
      - Analytics__SinkBaseUrl=http://isas.paymentservice:8080
      #
      # ⚠ 4 service .NET kia đều có dòng này; gateway thì KHÔNG, nên vế thứ ba của guard luôn rỗng.
      # Sink `InternalHttpTrafficController` so token bằng `FixedTimeEquals` và **fail-closed**
      # (thiếu/lệch → 401), nên token phải GIỐNG HỆT các service khác — xem DEPLOYMENT.md §3.
      - Internal__Token=${INTERNAL_TOKEN}
      #
      # ⚠ DEP: `Q5` phải có trong image đang chạy TRƯỚC khi bật cờ này. Bật flush ⇒ nhiều bucket ⇒
      # `AdminTrafficController` mới thật sự chạy nhánh `GroupBy(...).OrderBy(...)` đa-bucket, vốn
      # ném 500 trước khi `Q5` sửa. `Q5` đã merged (PR #147) nên nay an toàn; nếu rollback image
      # Payment về trước mốc đó thì phải đặt `ANALYTICS_ENABLED=false` cùng lúc.
      # ⚠ Mỗi `Cors__AllowedOrigins__N` GHI ĐÈ phần tử thứ N của mảng trong appsettings.json (5 phần tử:
      # localhost:4200 · localhost:3000 · localhost:5173 · issa.app · sep-490-angular.vercel.app) — không
      # phải nối thêm. Vì thế phải khai LẠI tường minh origin FE production ở index 5 và localhost:4200 ở
      # index 6, nếu không chúng bị chính các dòng 0-4 dưới đây ghi đè mất.
      # ⚠ Server đang khai TRÙNG index 4 hai lần (`${GATEWAY_PUBLIC_URL}` rồi `http://localhost:4200`) →
      # dòng sau thắng, `GATEWAY_PUBLIC_URL` rơi khỏi CORS. Bố cục dưới đây giữ đủ cả hai; sửa bên server theo.
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Cors__AllowedOrigins__2=http://localhost:5174
      - Cors__AllowedOrigins__3=https://isas-web-client.vercel.app
      - Cors__AllowedOrigins__4=${GATEWAY_PUBLIC_URL}
      - Cors__AllowedOrigins__5=https://sep-490-angular.vercel.app
      - Cors__AllowedOrigins__6=http://localhost:4200
    ports:
      - "5050:8080"
    depends_on: [isas.authservice, isas.interviewservice, isas.campaignservice, isas.paymentservice]
    networks: [isas-main-network]
    restart: unless-stopped

  # ===== AI LAYER (Python) — MỘT image, HAI tiến trình =====
  # Trước 2026-08-06 hai container này chạy trên MAC, gọi S3/RabbitMQ của server qua Tailscale.
  # Đo được link đó bão hoà ở ~1 MB/s, và audio phải đi vòng server(S3) → Mac → OpenAI ⇒ quét tải
  # `/decide-next` knee ở 0,5 req/s (~60 người đồng thời). Đưa về đây: chặng S3 thành loopback,
  # chỉ còn upload ra OpenAI qua đường 6,5 MB/s.
  #
  # Anchor dưới đây KHÔNG phải để tiết kiệm dòng: 2026-08-05 hai container này chạy HAI IMAGE khác
  # nhau 3 ngày (cùng tag `:local`), và trước đó USAGE_SINK_BASE/PROMPT_REGISTRY_BASE vắng ở một
  # bên khiến F21 + F22 tắt câm nhiều ngày. Khối env chung phải KHÔNG THỂ lệch giữa hai bên.
  aiapi:
    <<: *aiservice
    container_name: aiapi-main
    environment:
      <<: *aiservice-env
    # GEN-7 internal-only: `expose`, KHÔNG `ports` — không lộ cổng ra host. Interview/Campaign gọi
    # qua tên `aiapi`. Gateway CÓ trỏ tới đây (`ai-cluster` + `ApiServices__ai`) nhưng chỉ để Scalar
    # ở **Development** liệt kê + gọi được toàn bộ api; Production chặn `/api/v1/ai/*` bằng 404.
    expose: ["8000"]
    healthcheck:
      # image không có curl/wget — dùng chính python trong image.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # rộng: lần đầu volume rỗng phải tải ~800 MB model trước khi bind cổng.
      start_period: 180s
    depends_on: [seaweedfs]

  aiworker:
    <<: *aiservice
    container_name: aiworker-main
    command: python -m app.worker
    environment:
      <<: *aiservice-env
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      QUEUE_NAME: scoring_pipeline_queue
      # ⚠ KHÔNG dấu `/` cuối — worker.py ghép chuỗi trần, không rstrip.
      DOTNET_CALLBACK_BASE: http://isas.interviewservice:8080
      # C14 — giữ TẮT. Trình tự bật: deploy (tắt) → XẢ cv_screening_queue → true. Bật cùng lúc
      # deploy = 713 lượt Gemini cho 8 ứng viên (republisher đã nhân bản, đo 2026-08-02).
      # `callbackBase` của sàng CV lấy từ CHÍNH message, không phải env này.
      CV_SCREENING_ENABLED: ${CV_SCREENING_ENABLED:-false}
      SCORING_PREFETCH: ${SCORING_PREFETCH:-10}
    depends_on: [rabbitmq, seaweedfs]

networks:
  isas-main-network:
    driver: bridge

volumes:
  postgres_main_data:
  seaweedfs_main_data:
  qdrant_main_data:   # RAG grounding — kho vector Qdrant
  ai_hf_cache:        # model faster-whisper (HuggingFace hub cache)
  ai_insightface:     # dải model buffalo_l của insightface (face-verify)

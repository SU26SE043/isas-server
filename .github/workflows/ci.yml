name: CI/CD

on:
  push:
    branches: [main, dev, 'features/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  docker:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase repo owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push AuthService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.AuthService/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/isas.authservice:${{ github.ref_name }}

      - name: Build & Push InterviewService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.InterviewService/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/isas.interviewservice:${{ github.ref_name }}

      - name: Build & Push CampaignService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.CampaignService/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/isas.campaignservice:${{ github.ref_name }}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/gateway/Isas.Gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/isas.gateway:${{ github.ref_name }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/docker/${{ github.ref_name }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
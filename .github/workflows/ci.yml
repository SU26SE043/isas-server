name: CI/CD

on:
  push:
    branches: [main, dev, 'features/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build AuthService image
        run: |
          docker build \
            -f src/services/Isas.AuthService/Dockerfile \
            -t isas.authservice:ci .

      - name: Build Gateway image
        run: |
          docker build \
            -f src/gateway/Isas.Gateway/Dockerfile \
            -t isas.gateway:ci .
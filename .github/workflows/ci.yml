name: CI/CD

on:
  push:
    branches: [main, dev, 'features/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  test-python:
    name: Run AIService tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # khớp base image Dockerfile (ctranslate2 chưa có wheel 3.14)
          cache: pip
          cache-dependency-path: src/services/Isas.AIService/requirements-dev.txt

      # `conftest.py` stub faster_whisper/insightface nên KHÔNG cần tải model ~800 MB ở CI.
      - name: Install deps
        working-directory: src/services/Isas.AIService
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: src/services/Isas.AIService
        run: pytest -q

  docker:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [test, test-python]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase repo owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # BẮT BUỘC cho `cache-to type=registry` của step AIService: builder MẶC ĐỊNH trên runner
      # dùng driver `docker`, mà driver đó KHÔNG export cache được ("Cache export is not supported
      # for the docker driver"). `setup-buildx-action` dựng builder driver `docker-container`.
      # 5 image .NET không dùng cache nên trước giờ không lộ ra; chúng vẫn build bình thường dưới
      # driver mới vì đều `push: true` (driver container không nạp image vào daemon cục bộ).
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push AuthService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.AuthService/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.authservice:${{ github.ref_name }}

      - name: Build & Push InterviewService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.InterviewService/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.interviewservice:${{ github.ref_name }}

      - name: Build & Push CampaignService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.CampaignService/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.campaignservice:${{ github.ref_name }}

      - name: Build & Push PaymentService
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/Isas.PaymentService/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.paymentservice:${{ github.ref_name }}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/gateway/Isas.Gateway/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.gateway:${{ github.ref_name }}

      # AIService (Python). Ba điểm KHÁC hẳn 5 image .NET ở trên:
      #   • `context` là chính thư mục service, KHÔNG phải gốc repo (Dockerfile dùng
      #     `COPY requirements.txt .`) ⇒ `.dockerignore` gốc không áp dụng, phải có file riêng.
      #   • `platforms: linux/amd64` tường minh: server là x86_64 còn máy dev là Mac arm64.
      #   • cache registry: tầng pip ~2,5 GB (ctranslate2/onnxruntime/opencv), runner GitHub
      #     KHÔNG giữ layer cache giữa các lần chạy nên thiếu dòng này là build lại từ đầu mỗi lần.
      - name: Build & Push AIService
        uses: docker/build-push-action@v7
        with:
          context: src/services/Isas.AIService
          file: src/services/Isas.AIService/Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/isas.aiservice:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/isas.aiservice:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/isas.aiservice:buildcache,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/docker/${{ github.ref_name }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # --ignore-pull-failures: bỏ qua các service dùng image build tay/local (vd :bk14g
            # không có trên registry) thay vì để cả `pull` chết → khi đó các service :main
            # (auth/payment/gateway) mới thật sự được cập nhật khi deploy. Nếu không, pull nghẹn
            # ở tag local → server đứng yên image cũ dù CI xanh (job vẫn pass vì lệnh cuối prune OK).
            docker compose pull --ignore-pull-failures
            docker compose up -d --remove-orphans
            docker image prune -f